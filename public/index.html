<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Treadmill Dashboard (FTMS)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="glass.css" />
</head>
<body>
  <!-- shared icon symbols (24-unit grid scaled to the button: 100 x 100) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="logoFill" cx=".4" cy=".28" r=".9"><stop offset="0" stop-color="#63ba5f"/><stop offset=".45" stop-color="#2f8a3f"/><stop offset="1" stop-color="#114f27"/></radialGradient>
      <symbol id="i-minus" viewBox="0 0 100 100"><line x1="33" y1="50" x2="67" y2="50" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 100 100"><g stroke="currentColor" stroke-width="7" stroke-linecap="round"><line x1="33" y1="50" x2="67" y2="50"/><line x1="50" y1="33" x2="50" y2="67"/></g></symbol>
      <symbol id="i-play" viewBox="0 0 100 100"><path d="M34 30 L70 50 L34 70 Z" fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/></symbol>
      <symbol id="i-pause" viewBox="0 0 100 100"><g fill="currentColor"><rect x="33" y="33" width="11" height="34" rx="4.4"/><rect x="56" y="33" width="11" height="34" rx="4.4"/></g></symbol>
      <symbol id="i-stop" viewBox="0 0 100 100"><rect x="36" y="36" width="28" height="28" rx="7" fill="#c2402f"/></symbol>
      <symbol id="i-reset" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"><path d="M63.02 39.07 A17 17 0 1 0 64.72 58.5"/><polyline points="66.46,69.89 64.72,58.5 53.98,62.69"/></g></symbol>
      <symbol id="i-route" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="62" r="5.5"/><circle cx="62" cy="38" r="5.5"/><path d="M44 62 H52 Q56 62 56 57 V47 Q56 40 60 40"/></g></symbol>
      <symbol id="i-clock" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="19"/><polyline points="50,41 50,50 57,54"/></g></symbol>
      <symbol id="i-chev" viewBox="0 0 100 100"><g fill="none" stroke="#e8ffc0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><polyline points="36,35 50,50 36,65" transform="translate(10 0)"/><polyline points="36,35 50,50 36,65" transform="translate(-8 0)" opacity=".55"/></g></symbol>
    </defs>
  </svg>

  <main class="page">

    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect x="1" y="1" width="62" height="62" rx="16" fill="url(#logoFill)" stroke="#bff08a" stroke-opacity=".7" stroke-width="2"/><g fill="none" stroke="#d7ff8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18 28 32 14 46" opacity=".4"/><path d="M26 18 40 32 26 46" opacity=".7"/><path d="M38 18 52 32 38 46"/></g></svg>
        <div>
          <h1>Treadmill</h1>
          <p><i id="statusDot" class="dot"></i><span id="status">Not connected</span></p>
        </div>
      </div>
      <button id="connectBtn" class="gbtn pill" style="--w:164;--h:52;--r:18;padding-left:8px;gap:14px;font-size:16px">
        <span class="gbtn dark" style="--s:40;--r:12"><svg class="ic"><use href="#i-chev"/></svg></span>
        <span id="connectLabel">Connect</span>
      </button>
    </header>

    <div id="error" class="hidden glass plain err"></div>

    <div class="board">

      <!-- hero: speed gauge -->
      <section class="glass hero"><div class="hero-in">
        <button id="resetBtn" class="gbtn pill reset at" style="--x:712;--y:26;--w:122;--h:44;--r:14">
          <svg class="ic sm"><use href="#i-reset"/></svg><span>Reset</span>
        </button>

        <svg class="gauge" viewBox="0 0 860 650" aria-hidden="false">
          <defs>
            <linearGradient id="prog" gradientUnits="userSpaceOnUse" x1="255" y1="401.2" x2="430" y2="95"><stop offset="0" stop-color="#1d7a3a"/><stop offset="1" stop-color="#b4e04a"/></linearGradient>
            <radialGradient id="knobFill" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eaf4d4"/></radialGradient>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
          </defs>
          <path d="M306.3 393.7 A175 175 0 1 1 553.7 393.7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="20" stroke-linecap="round"/>
          <path id="arcGlow" fill="none" stroke="#9be04a" stroke-opacity=".55" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
          <path id="arc" fill="none" stroke="url(#prog)" stroke-width="20" stroke-linecap="round"/>
          <circle id="knob" cx="306.3" cy="393.7" r="18" fill="url(#knobFill)" stroke="#2f8a3f" stroke-width="5.6"/>
          <text x="286.3" y="433.7" font-size="15" font-weight="600" fill="#2f5f3d" text-anchor="middle">0</text>
          <text id="maxLabel" x="573.7" y="433.7" font-size="15" font-weight="600" fill="#2f5f3d" text-anchor="middle">12</text>
          <text x="430" y="218" font-size="15" font-weight="600" fill="#2f5f3d" text-anchor="middle" letter-spacing="4">SPEED</text>
          <text id="speed" class="num" x="430" y="322" font-size="132" font-weight="700" fill="#0f3d22" text-anchor="middle" style="font-variant-numeric:tabular-nums">0.0</text>
          <text x="430" y="358" font-size="22" font-weight="500" fill="#2f5f3d" text-anchor="middle">km/h</text>
        </svg>
        <input id="customSpeed" class="ctrl speed-input" type="number" min="0" max="6" step="0.1" inputmode="decimal" aria-label="Speed in km/h" hidden disabled />

        <button id="slower" class="gbtn ctrl at" style="--x:332;--y:430;--s:68;--r:20.4" aria-label="Slower"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button id="faster" class="gbtn ctrl at" style="--x:460;--y:430;--s:68;--r:20.4" aria-label="Faster"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button id="toggleBtn" class="gbtn white ctrl at" style="--x:339;--y:528;--s:92;--r:27.6" aria-label="Start / pause">
          <svg class="ic i-play"><use href="#i-play"/></svg><svg class="ic i-pause"><use href="#i-pause"/></svg>
        </button>
        <button id="stopBtn" class="gbtn ctrl at" style="--x:453;--y:540;--s:68;--r:20.4" aria-label="Stop"><svg class="ic"><use href="#i-stop"/></svg></button>
      </div></section>

      <div class="side">
        <section class="glass rt dt"><div class="rt-in">
          <svg class="fill" viewBox="0 0 380 200"><text class="lbl" x="36" y="50">DISTANCE</text><text class="big" x="36" y="144"><tspan id="distance">0.00</tspan><tspan class="unit" dx="12">km</tspan></text></svg>
          <span class="gbtn at" style="--x:310;--y:22;--s:56;--r:16.8"><svg class="ic"><use href="#i-route"/></svg></span>
        </div></section>

        <section class="glass rt dt"><div class="rt-in">
          <svg class="fill" viewBox="0 0 380 200"><text class="lbl" x="36" y="50">TIME</text><text class="big" x="36" y="144"><tspan id="time">00:00</tspan></text></svg>
          <span class="gbtn at" style="--x:310;--y:22;--s:56;--r:16.8"><svg class="ic"><use href="#i-clock"/></svg></span>
        </div></section>

        <section class="glass rt q"><div class="rt-in">
          <svg class="fill" viewBox="0 0 380 210"></svg>
          <button class="gbtn preset ctrl at" style="--x:41;--y:64;--s:60;--r:18" data-speed="1" disabled>1.0</button>
          <button class="gbtn preset ctrl at" style="--x:160;--y:64;--s:60;--r:18" data-speed="2" disabled>2.0</button>
          <button class="gbtn preset ctrl at" style="--x:279;--y:64;--s:60;--r:18" data-speed="3" disabled>3.0</button>
          <button class="gbtn preset ctrl at" style="--x:41;--y:134;--s:60;--r:18" data-speed="4" disabled>4.0</button>
          <button class="gbtn preset ctrl at" style="--x:160;--y:134;--s:60;--r:18" data-speed="5" disabled>5.0</button>
          <button class="gbtn preset ctrl at" style="--x:279;--y:134;--s:60;--r:18" data-speed="6" disabled>6.0</button>
        </div></section>
      </div>
    </div>

    <details class="glass plain log">
      <summary>Log</summary>
      <pre id="log"></pre>
    </details>
  </main>

<script>
"use strict";

const UUID = {
  FTMS_SERVICE:      0x1826,
  FTMS_FEATURE:      0x2acc,
  TREADMILL_DATA:    0x2acd,
  SPEED_RANGE:       0x2ad4,
  CONTROL_POINT:     0x2ad9,
};

// FTMS Control Point opcodes
const OP = { REQUEST_CONTROL: 0x00, RESET: 0x01, SET_SPEED: 0x02, START: 0x07, STOP_PAUSE: 0x08, RESPONSE: 0x80 };
const RESULT = { 1: "Success", 2: "Op code not supported", 3: "Invalid parameter", 4: "Operation failed", 5: "Control not permitted" };

/* FTMS Treadmill Data (0x2ACD) parser. Little-endian. 16-bit Flags, then fields in fixed order,
   each present only if its flag bit is set (bit 0 is INVERTED: 0 => speed present). */
function parseTreadmillData(dv) {
  let o = 0;
  const u8  = () => { const v = dv.getUint8(o);          o += 1; return v; };
  const u16 = () => { const v = dv.getUint16(o, true);   o += 2; return v; };
  const s16 = () => { const v = dv.getInt16(o, true);    o += 2; return v; };
  const u24 = () => { const v = dv.getUint16(o, true) | (dv.getUint8(o + 2) << 16); o += 3; return v; };

  const flags = u16();
  const has = (bit) => (flags & (1 << bit)) !== 0;
  const r = {};

  if (!has(0)) r.speedKmh = u16() * 0.01;
  if (has(1))  r.avgSpeedKmh = u16() * 0.01;
  if (has(2))  r.distanceM = u24();
  if (has(3)) {
    r.inclinePct = s16() * 0.1;
    r.rampAngleDeg = s16() * 0.1;
  }
  if (has(4)) {
    r.elevGainPosM = u16() * 0.1;
    r.elevGainNegM = u16() * 0.1;
  }
  if (has(5))  r.paceMinPerKm = u8() * 0.1;
  if (has(6))  r.avgPaceMinPerKm = u8() * 0.1;
  if (has(7)) {
    const total = u16(), perHour = u16(), perMin = u8();
    if (total !== 0xffff)   r.energyKcal = total;
    if (perHour !== 0xffff) r.energyPerHour = perHour;
    if (perMin !== 0xff)    r.energyPerMin = perMin;
  }
  if (has(8))  r.heartRate = u8();
  if (has(9))  r.metabolicEq = u8() * 0.1;
  if (has(10)) r.elapsedS = u16();
  if (has(11)) r.remainingS = u16();
  if (has(12)) { r.forceOnBeltN = s16(); r.powerW = s16(); }
  return r;
}

const state = {
  device: null,
  userDisconnected: false,
  reconnecting: false,
  controlPoint: null,
  hasControl: false,
  pending: null,
  queue: Promise.resolve(),
  speedMin: 0, speedMax: 6.0, speedStep: 0.1,
  targetKmh: null,
  speed: 0,
  deviceDistanceM: null, deviceElapsedS: null,
  localDistanceKm: 0, localSeconds: 0,
  lastTick: performance.now(),
};

const $ = (id) => document.getElementById(id);
const el = {
  status: $("status"), error: $("error"), connect: $("connectBtn"), log: $("log"),
  speed: $("speed"), distance: $("distance"), time: $("time"),
  custom: $("customSpeed"),
  statusDot: $("statusDot"), connectLabel: $("connectLabel"),
  maxLabel: $("maxLabel"), arc: $("arc"), arcGlow: $("arcGlow"), knob: $("knob"),
  slower: $("slower"), faster: $("faster"), toggle: $("toggleBtn"), stop: $("stopBtn"),
};

function log(msg) {
  el.log.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
  el.log.scrollTop = el.log.scrollHeight;
  console.log(msg);
}
function setStatus(msg) {
  el.status.textContent = msg;
  el.statusDot.classList.toggle("on", /^Connected/.test(msg));
}
function showError(msg) { el.error.textContent = msg; el.error.classList.remove("hidden"); log("ERROR: " + msg); }
function clearError() { el.error.classList.add("hidden"); }
function setControlsEnabled(on) {
  document.querySelectorAll(".ctrl").forEach((b) => (b.disabled = !on));
}

/* Translate Web Bluetooth errors into something a human can act on */
function explainError(e) {
  switch (e && e.name) {
    case "NotFoundError":
      return /cancel/i.test(e.message) ? "Device selection was cancelled."
        : "No matching device found. Make sure the treadmill is on, awake, and not connected to another app/phone.";
    case "SecurityError":
      return "Bluetooth blocked: the page must be on HTTPS or localhost, and Bluetooth permission must be allowed.";
    case "NotAllowedError":
      return "Bluetooth permission denied. Allow it in the browser/site settings and make sure Bluetooth is on.";
    case "NetworkError":
      return "Connection to the treadmill failed or dropped. Move closer and try again.";
    case "NotSupportedError":
      return "The treadmill doesn't support this operation.";
    case "InvalidStateError":
      return "Bluetooth is busy or the device is in an invalid state. Try reconnecting.";
    default:
      return (e && e.message) || String(e);
  }
}

const fmtTime = (s) => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, "0"), ss = String(sec).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};

function render() {
  el.speed.textContent = state.speed.toFixed(1);
  const km = state.deviceDistanceM != null ? state.deviceDistanceM / 1000 : state.localDistanceKm;
  el.distance.textContent = km.toFixed(2);
  el.time.textContent = fmtTime(state.deviceElapsedS != null ? state.deviceElapsedS : state.localSeconds);

  // Gauge: 270 degree arc from bottom-left (135 deg) round the top to bottom-right
  const max = state.speedMax > 0 ? state.speedMax : 12;
  const f = Math.min(1, Math.max(0, state.speed / max));
  const a = (135 + 270 * f) * Math.PI / 180;
  const ex = (430 + 175 * Math.cos(a)).toFixed(1), ey = (270 + 175 * Math.sin(a)).toFixed(1);
  el.knob.setAttribute("cx", ex); el.knob.setAttribute("cy", ey);
  const d = f > 0.002 ? `M306.3 393.7 A175 175 0 ${f > 2 / 3 ? 1 : 0} 1 ${ex} ${ey}` : "";
  el.arc.setAttribute("d", d); el.arcGlow.setAttribute("d", d);
  el.maxLabel.textContent = String(Math.round(max * 10) / 10);

  const running = state.speed > 0.05;
  el.toggle.classList.toggle("running", running);
  const shown = state.targetKmh != null ? state.targetKmh : state.speed;
  document.querySelectorAll(".preset").forEach((b) =>
    b.classList.toggle("is-active", Math.abs(parseFloat(b.dataset.speed) - shown) < 0.05));
}

/* Local fallback integration (used if the treadmill omits distance / elapsed time) */
setInterval(() => {
  const now = performance.now();
  const dt = (now - state.lastTick) / 1000;
  state.lastTick = now;
  if (state.device && state.device.gatt.connected && state.speed > 0) {
    state.localSeconds += dt;
    state.localDistanceKm += (state.speed * dt) / 3600;
  }
  render();
}, 250);

function onTreadmillData(ev) {
  let d;
  try { d = parseTreadmillData(ev.target.value); }
  catch (e) { log("Bad treadmill packet: " + e.message); return; }

  if (d.speedKmh != null) {
    state.speed = d.speedKmh;
    if (state.targetKmh == null) state.targetKmh = Math.max(state.speedMin, Math.round(d.speedKmh * 10) / 10);
  }
  if (d.distanceM != null) state.deviceDistanceM = d.distanceM;
  if (d.elapsedS != null)  state.deviceElapsedS = d.elapsedS;
  render();
}

/* Control-point indications: [0x80, requestOpcode, resultCode, ...] */
function onControlResponse(ev) {
  const v = ev.target.value;
  if (v.getUint8(0) !== OP.RESPONSE) return;
  const opcode = v.getUint8(1), result = v.getUint8(2);
  log(`CP response: op 0x${opcode.toString(16)} -> ${RESULT[result] || result}`);
  const p = state.pending;
  if (p && p.opcode === opcode) {
    clearTimeout(p.timer);
    state.pending = null;
    result === 1 ? p.resolve() : p.reject(new Error(RESULT[result] || `Result ${result}`));
  }
}

function sendControl(bytes) {
  const run = () => new Promise((resolve, reject) => {
    if (!state.controlPoint) return reject(new Error("Control point not available"));
    const timer = setTimeout(() => { state.pending = null; reject(new Error("Treadmill did not respond")); }, 5000);
    state.pending = { opcode: bytes[0], resolve, reject, timer };
    state.controlPoint.writeValueWithResponse(new Uint8Array(bytes)).catch((e) => {
      clearTimeout(timer); state.pending = null; reject(e);
    });
  });
  state.queue = state.queue.then(run, run);
  return state.queue;
}

async function safeControl(label, bytes) {
  try { clearError(); await sendControl(bytes); }
  catch (e) { showError(`${label} failed: ${explainError(e)}`); }
}

const setSpeedBytes = (kmh) => {
  const raw = Math.round(kmh * 100);
  return [OP.SET_SPEED, raw & 0xff, (raw >> 8) & 0xff];
};

async function setSpeed(kmh) {
  if (!Number.isFinite(kmh)) return;
  const next = Math.min(state.speedMax, Math.max(state.speedMin, Math.round(kmh * 10) / 10));
  state.targetKmh = next;
  render();
  await safeControl("Set speed", setSpeedBytes(next));
}

const changeSpeed = (delta) => setSpeed((state.targetKmh != null ? state.targetKmh : state.speed) + delta);

// Preset buttons and custom speed input
document.querySelectorAll(".preset").forEach((b) => (b.onclick = () => setSpeed(parseFloat(b.dataset.speed))));
// Tap the big number to type a speed
el.speed.onclick = () => {
  if (el.custom.disabled) return;
  el.custom.min = state.speedMin; el.custom.max = state.speedMax;
  el.custom.value = (state.targetKmh != null ? state.targetKmh : state.speed).toFixed(1);
  el.custom.hidden = false; el.custom.focus(); el.custom.select();
};
const closeCustom = () => { el.custom.hidden = true; };
el.custom.onblur = closeCustom;
el.custom.onkeydown = (e) => {
  if (e.key === "Escape") return closeCustom();
  if (e.key !== "Enter") return;
  const v = parseFloat(el.custom.value);
  if (!Number.isFinite(v) || v < state.speedMin || v > state.speedMax) {
    showError(`Enter a speed between ${state.speedMin.toFixed(1)} and ${state.speedMax.toFixed(1)} km/h.`);
    return;
  }
  closeCustom();
  setSpeed(v);
};

el.faster.onclick = () => changeSpeed(+state.speedStep);
el.slower.onclick = () => changeSpeed(-state.speedStep);
const doStart = async () => {
  await safeControl("Start", [OP.START]);
  if (state.targetKmh != null) await safeControl("Set speed", setSpeedBytes(state.targetKmh));
};
const doPause = async () => {
  try {
    clearError();
    await sendControl([OP.STOP_PAUSE, 0x02]);
    // Some treadmills ack pause with Success but keep running; verify the belt actually slowed
    await new Promise((r) => setTimeout(r, 3000));
    if (state.speed > 0.1) {
      log("Pause acknowledged but belt still at " + state.speed.toFixed(1) + " km/h; setting speed to 0 instead");
      await safeControl("Pause", setSpeedBytes(0));
    }
  } catch (e) {
    // Many treadmills ignore or reject FTMS pause; drop the belt to 0 instead (target is kept so Start resumes)
    log("Pause not accepted (" + explainError(e) + "); setting speed to 0 instead");
    await safeControl("Pause", setSpeedBytes(0));
  }
};
el.stop.onclick   = () => safeControl("Stop",  [OP.STOP_PAUSE, 0x01]);
el.toggle.onclick = () => (state.speed > 0.05 ? doPause() : doStart());
$("resetBtn").onclick = () => {
  state.localSeconds = 0; state.localDistanceKm = 0;
  state.deviceDistanceM = null; state.deviceElapsedS = null;
  render();
};

async function setupGatt(server) {
  let ftms = null;
  try { ftms = await server.getPrimaryService(UUID.FTMS_SERVICE); } catch (_) { }

  if (ftms) {
    const data = await ftms.getCharacteristic(UUID.TREADMILL_DATA);
    data.addEventListener("characteristicvaluechanged", onTreadmillData);
    await data.startNotifications();
    log("Subscribed to Treadmill Data");

    try {
      const rng = await (await ftms.getCharacteristic(UUID.SPEED_RANGE)).readValue();
      state.speedMin  = rng.getUint16(0, true) * 0.01;
      state.speedMax  = rng.getUint16(2, true) * 0.01;
      state.speedStep = Math.max(0.1, rng.getUint16(4, true) * 0.01);
      log(`Speed range ${state.speedMin}-${state.speedMax} km/h`);
    } catch (_) { log("Speed range not readable; using defaults"); }

    try {
      const cp = await ftms.getCharacteristic(UUID.CONTROL_POINT);
      cp.addEventListener("characteristicvaluechanged", onControlResponse);
      await cp.startNotifications();
      state.controlPoint = cp;
      await sendControl([OP.REQUEST_CONTROL]);
      state.hasControl = true;
      setControlsEnabled(true);
      log("Control granted");
    } catch (e) {
      state.hasControl = false;
      setControlsEnabled(false);
      log("Control unavailable: " + explainError(e));
    }
  }

  if (!ftms) log("No FTMS service on this device (unsupported treadmill).");
}

async function connectToDevice(device) {
  setStatus(`Connecting to ${device.name || "device"}…`);
  const server = await device.gatt.connect();
  await setupGatt(server);
  setStatus(`Connected · ${device.name || "device"}`);
  el.connectLabel.textContent = "Disconnect";
}

function resetUiDisconnected(msg) {
  setStatus(msg);
  setControlsEnabled(false);
  el.connectLabel.textContent = "Connect";
  state.speed = 0; state.hasControl = false; state.controlPoint = null;
  render();
}

/* Auto-reconnect with exponential backoff (1,2,4,8,16 s) */
async function reconnect() {
  if (state.reconnecting) return;
  state.reconnecting = true;
  for (let attempt = 1; attempt <= 5 && !state.userDisconnected; attempt++) {
    const wait = 1000 * 2 ** (attempt - 1);
    setStatus(`Connection lost. Reconnecting (${attempt}/5) in ${wait / 1000}s…`);
    await new Promise((r) => setTimeout(r, wait));
    if (state.userDisconnected) break;
    try {
      await connectToDevice(state.device);
      clearError();
      state.reconnecting = false;
      log("Reconnected");
      return;
    } catch (e) { log(`Reconnect ${attempt} failed: ${explainError(e)}`); }
  }
  state.reconnecting = false;
  if (!state.userDisconnected) {
    resetUiDisconnected("Disconnected");
    showError("Could not reconnect automatically. Press Connect to try again.");
  }
}

function onGattDisconnected() {
  log("GATT disconnected");
  if (state.pending) { clearTimeout(state.pending.timer); state.pending = null; }
  setControlsEnabled(false);
  state.speed = 0; render();
  if (!state.userDisconnected) reconnect();
  else resetUiDisconnected("Disconnected");
}

async function connect() {
  clearError();
  state.userDisconnected = false;
  try {
    // Show only devices advertising FTMS
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UUID.FTMS_SERVICE] }],
    });
    if (state.device) state.device.removeEventListener("gattserverdisconnected", onGattDisconnected);
    state.device = device;
    device.addEventListener("gattserverdisconnected", onGattDisconnected);
    state.lastTick = performance.now();
    await connectToDevice(device);
  } catch (e) {
    const msg = explainError(e);
    if (e.name === "NotFoundError" && /cancel/i.test(e.message)) { log(msg); setStatus("Not connected"); }
    else { showError(msg); resetUiDisconnected("Not connected"); }
  }
}

function disconnect() {
  state.userDisconnected = true;
  if (state.device && state.device.gatt.connected) state.device.gatt.disconnect();
  else resetUiDisconnected("Disconnected");
}

el.connect.onclick = () => {
  if (state.device && state.device.gatt.connected) disconnect(); else connect();
};

(function init() {
  setControlsEnabled(false);
  if (!window.isSecureContext) {
    showError("Web Bluetooth needs a secure context. Open this page via https:// or http://localhost.");
    el.connect.disabled = true;
  } else if (!("bluetooth" in navigator)) {
    showError("This browser doesn't support Web Bluetooth. Use Chrome or Edge on desktop/Android (iOS: the Bluefy browser).");
    el.connect.disabled = true;
  } else {
    navigator.bluetooth.getAvailability?.().then((ok) => {
      if (!ok) showError("No Bluetooth adapter available, or Bluetooth is turned off.");
    }).catch(() => {});
  }
  render();
})();
</script>
</body>
</html>
